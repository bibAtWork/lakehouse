# Unity Catalog Configuration
unity.catalog.enabled=true
unity.catalog.catalog=main
unity.catalog.schema=default
unity.catalog.warehouse=your-warehouse-id

# Databricks Configuration
databricks.host=https://your-workspace.cloud.databricks.com
databricks.token=your-databricks-token
databricks.cluster.id=your-cluster-id

# Metadata Management
unity.catalog.metadata.enabled=true
unity.catalog.lineage.enabled=true
unity.catalog.audit.enabled=true

# Security
unity.catalog.security.enabled=true
unity.catalog.encryption.enabled=true

# Performance
unity.catalog.cache.enabled=true
unity.catalog.cache.ttl=3600 