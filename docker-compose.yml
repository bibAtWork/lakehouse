version: '3.8'

services:
  # PostgreSQL for metadata and dbt
  postgres:
    image: bitnami/postgresql:17.5.0
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lakehouse_network

  # Unity Catalog for local metadata management
  unity-catalog:
    image: unitycatalog/unitycatalog:latest
    ports:
      - "8081:8080"
    environment:
      - UNITY_CATALOG_CATALOG=${UNITY_CATALOG_CATALOG}
      - UNITY_CATALOG_SCHEMA=${UNITY_CATALOG_SCHEMA}
      - UNITY_CATALOG_METADATA_DB_HOST=postgres
      - UNITY_CATALOG_METADATA_DB_PORT=${DB_PORT}
      - UNITY_CATALOG_METADATA_DB_NAME=${DB_NAME}
      - UNITY_CATALOG_METADATA_DB_USER=${DB_USER}
      - UNITY_CATALOG_METADATA_DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - unity_catalog_data:/var/unitycatalog/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lakehouse_network

  # Spark Master
  spark-master:
    image: bitnami/spark:4.0
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./config/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lakehouse_network

  # Spark Worker
  spark-worker:
    image: bitnami/spark:4.0
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./config/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./data:/opt/bitnami/spark/data
    networks:
      - lakehouse_network

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lakehouse_network

  # Dagster webserver and daemon combined
  dagster:
    build:
      context: .
      dockerfile: ./Dockerfile.dagster
    container_name: lakehouse_dagster
    restart: always
    ports:
      - '3000:3000'
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_USER: ${DB_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DB_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DB_NAME}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
      UNITY_CATALOG_HOST: ${UNITY_CATALOG_HOST}
      UNITY_CATALOG_CATALOG: ${UNITY_CATALOG_CATALOG}
      UNITY_CATALOG_SCHEMA: ${UNITY_CATALOG_SCHEMA}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - ./src/dagster:/opt/dagster/app
    networks:
      - lakehouse_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Generating dagster.yaml with environment variables...' &&
        envsubst < dagster.yaml.template > dagster.yaml &&
        echo 'Starting Dagster daemon in background...' &&
        dagster-daemon run &
        echo 'Starting Dagster webserver...' &&
        dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
      "

networks:
  lakehouse_network:
    driver: bridge
    name: lakehouse_network

volumes:
  postgres_data:
  minio_data:
  unity_catalog_data:
  dagster_data: 