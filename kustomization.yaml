apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lakehouse
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: lakehouse-code
    files:
      - package_init.py=src/dagster/__init__.py
      - assets_init.py=src/dagster/assets/__init__.py
      - bronze.py=src/dagster/assets/bronze.py
      - screener.py=src/dagster/assets/screener.py
      - dedup.py=src/dagster/dedup.py
  - name: lakehouse-dagster-config
    files:
      - dagster.yaml=config/dagster.yaml
      - workspace.yaml=config/workspace.yaml
