name: Dagster image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dagster
          load: true
          tags: lakehouse-dagster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check Dagster code location
        run: docker run --rm lakehouse-dagster:ci python -c "from lakehouse import defs; assert len(defs.assets) == 2"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dagster
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/bibatwork/lakehouse-dagster:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
